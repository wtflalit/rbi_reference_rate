name: Daily Reference Rates

on:
  schedule:
    # 09:00 UTC = 14:30 IST, one hour after FBIL's ~13:30 IST publication.
    - cron: "0 9 * * 1-5"

  workflow_dispatch:
    inputs:
      date:
        description: "Business date (YYYY-MM-DD). Blank = today in IST."
        required: false
        type: string
      sources:
        description: "Source chain, comma separated."
        required: false
        default: "fbil,rbi,frankfurter"
        type: string
      force:
        description: "Ignore weekend/holiday gating."
        required: false
        default: false
        type: boolean

# Needed to push the generated files back into the repo.
permissions:
  contents: write

# Two runs must never race each other into the same commit.
concurrency:
  group: daily-rates
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - - name: Fetch rates, build Excel and PDF
        env:
          LOG_LEVEL: INFO
        run: |
          ARGS="--no-upload --output-dir data"
          if [ -n "${{ inputs.date }}" ];    then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ inputs.sources }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "Running: python -m src.main $ARGS"
          python -m src.main $ARGS
      - name: Commit new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebase is the wrong tool here. Two runs on the same day produce
          # byte-different xlsx files (timestamps are embedded in the format),
          # git cannot merge binaries, and the rebase stops on an add/add
          # conflict. Instead: move onto the latest origin first, then let the
          # freshly generated files replace whatever is already there.
          git fetch origin ${{ github.ref_name }}
          git reset --mixed origin/${{ github.ref_name }}

          git add data/

          # Weekend, holiday, or nothing published: the script wrote no file,
          # so nothing is staged. Exit quietly rather than failing.
          if git diff --staged --quiet; then
            echo "No new data for today — nothing to commit."
            exit 0
          fi

          git commit -m "Reference rates: $(date -u +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}
