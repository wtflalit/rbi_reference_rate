name: Drive Sync

# Uploads data/ to Google Drive using the service-account key.
#
# Two modes:
#   * scheduled / default  -> uploads only what Drive does not already have
#   * sync_all: true       -> re-checks every file (use after the backfill)
#
# Requires two repository secrets:
#   GDRIVE_SERVICE_ACCOUNT_JSON  - the whole contents of the key .json file
#   GDRIVE_FOLDER_ID             - the part of the folder URL after /folders/
#
# The destination folder MUST be shared with the service account's email
# (the "client_email" field inside the JSON) with Editor access. Without that
# the run fails at "Verify Drive access" with a 404 — a service account is a
# separate identity from your own Google account and sees nothing by default.

on:
  schedule:
    # 09:20 UTC = 14:50 IST, 20 minutes after the daily rates job commits.
    - cron: "20 9 * * 1-5"

  workflow_dispatch:
    inputs:
      sync_all:
        description: "Ignore the manifest and re-check every file."
        required: false
        default: false
        type: boolean
      max_files:
        description: "Stop after N files this run (0 = no limit)."
        required: false
        default: "0"
        type: string
      check_only:
        description: "Just verify credentials and folder access, then stop."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write service-account key
        env:
          SA_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::Secret GDRIVE_SERVICE_ACCOUNT_JSON is empty or unset."
            exit 1
          fi
          printf '%s' "$SA_KEY" > service_account.json
          python -c "import json;d=json.load(open('service_account.json'));print('Service account:', d['client_email'])" \
            || { echo "::error::Secret is not valid JSON — paste the whole key file, braces included."; exit 1; }

      - name: Verify Drive access
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
        run: python -m src.main --check-drive

      - name: Upload to Drive
        if: inputs.check_only != true
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          SYNC_ALL: ${{ inputs.sync_all }}
          MAX_FILES: ${{ inputs.max_files }}
        run: |
          cat > /tmp/sync.py <<'PYEOF'
          """Upload data/ to Drive, skipping anything already uploaded.

          The manifest maps each file to its SHA-256. Files whose hash is
          unchanged are skipped without an API call, which is what keeps the
          daily run to a couple of seconds and makes a interrupted bulk run
          resumable rather than restarting from zero.
          """
          import hashlib, json, os, sys
          from pathlib import Path

          sys.path.insert(0, ".")
          from src.drive_client import DriveError, client_from_env

          DATA = Path("data")
          MANIFEST = DATA / ".drive_manifest.json"
          UPLOADABLE = {".xlsx", ".pdf"}

          sync_all = os.environ.get("SYNC_ALL", "").lower() == "true"
          max_files = int(os.environ.get("MAX_FILES") or 0)

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(65536), b""):
                      h.update(chunk)
              return h.hexdigest()

          if not DATA.exists():
              print("No data/ directory — nothing to upload.")
              sys.exit(0)

          manifest = {}
          if MANIFEST.exists() and not sync_all:
              try:
                  manifest = json.loads(MANIFEST.read_text())
              except json.JSONDecodeError:
                  print("Manifest unreadable — treating as empty.")

          files = sorted(p for p in DATA.rglob("*")
                         if p.is_file() and p.suffix.lower() in UPLOADABLE)

          pending = []
          for path in files:
              rel = str(path.relative_to(DATA))
              digest = sha256(path)
              if manifest.get(rel) != digest:
                  pending.append((path, rel, digest))

          print(f"{len(files)} files on disk, "
                f"{len(files) - len(pending)} already in Drive, "
                f"{len(pending)} to upload")

          if not pending:
              print("Drive is up to date.")
              sys.exit(0)

          if max_files and len(pending) > max_files:
              print(f"Limiting this run to {max_files}; "
                    f"{len(pending) - max_files} will remain for the next run.")
              pending = pending[:max_files]

          drive = client_from_env()
          print("Drive folder:", drive.check_access())

          done = failed = 0
          try:
              for path, rel, digest in pending:
                  try:
                      drive.upload_or_replace(path)
                  except DriveError as exc:
                      print(f"  FAILED {rel}: {exc}")
                      failed += 1
                      # A quota or permission error will hit every remaining
                      # file too — stop rather than emit 4,000 identical errors.
                      if "storageQuota" in str(exc) or "403" in str(exc):
                          print("  Fatal error — stopping early.")
                          break
                      continue
                  # Recorded only after Drive confirms, so a crash never marks
                  # a file as uploaded when it is not.
                  manifest[rel] = digest
                  done += 1
                  if done % 100 == 0:
                      print(f"  {done}/{len(pending)} uploaded")
          finally:
              # Always persist progress — this is what makes a re-run resume.
              MANIFEST.parent.mkdir(parents=True, exist_ok=True)
              MANIFEST.write_text(json.dumps(manifest, indent=0, sort_keys=True))
              print(f"Manifest saved: {len(manifest)} files recorded")

          print(f"Uploaded {done}, failed {failed}")
          remaining = len(files) - len(manifest)
          if remaining > 0:
              print(f"{remaining} files still pending — run this workflow again.")
          sys.exit(1 if failed and not done else 0)
          PYEOF
          python /tmp/sync.py

      - name: Commit manifest
        if: always() && inputs.check_only != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin ${{ github.ref_name }}
          git reset --mixed origin/${{ github.ref_name }}

          git add data/.drive_manifest.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Manifest unchanged."
            exit 0
          fi
          git commit -m "Drive sync progress"
          git push origin HEAD:${{ github.ref_name }}

      # The key is written into the workspace, which is destroyed with the
      # runner anyway — but shredding it costs nothing.
      - name: Shred credentials
        if: always()
        run: rm -f service_account.json
