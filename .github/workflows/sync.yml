name: Sync files to Google Drive

on:
  push:
    branches: [ main ]  # Triggers on every push to the main branch

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload files to Google Drive
        uses: samuelint/google-drive-upload@v1.1.3  # Or any other Drive upload action you prefer
        with:
          folder_id: ${{ secrets.DRIVE_FOLDER_ID }}
          service_account: ${{ secrets.GDRIVE_CREDENTIALS }} # The base64-encoded key
          source_path: "path/to/your/files/*.xlsx path/to/your/files/*.pdf" # Update this to point to your Excel and PDF files
          # destination_path: "subfolder" # Optional: specify a subfolder within your Drive folder
