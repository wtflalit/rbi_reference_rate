name: Sync files to Google Drive

on:
  push:
    branches: [ main ]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Drive API
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Upload to Google Drive
        env:
          CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python - <<EOF
          import base64
          import json
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          import glob

          # Decode credentials
          creds_json = base64.b64decode(os.environ['CREDENTIALS']).decode('utf-8')
          creds_dict = json.loads(creds_json)
          credentials = service_account.Credentials.from_service_account_info(creds_dict)
          drive_service = build('drive', 'v3', credentials=credentials)

          folder_id = os.environ['FOLDER_ID']

          # Find all Excel and PDF files
          files_to_upload = []
          files_to_upload.extend(glob.glob('*.xlsx'))
          files_to_upload.extend(glob.glob('*.xls'))
          files_to_upload.extend(glob.glob('*.pdf'))

          if not files_to_upload:
              print("No Excel or PDF files found!")
              exit(1)

          for file_path in files_to_upload:
              print(f"Uploading: {file_path}")
              media = MediaFileUpload(file_path, resumable=True)
              file_metadata = {
                  'name': os.path.basename(file_path),
                  'parents': [folder_id]
              }
              file = drive_service.files().create(
                  body=file_metadata,
                  media_body=media,
                  fields='id'
              ).execute()
              print(f"Uploaded {file_path} with ID: {file.get('id')}")
          EOF
