name: Historical Backfill

# Manual only. This is a one-off job that writes thousands of files; it must
# never fire on a schedule.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date (YYYY-MM-DD). Default 2018-07-01, the FBIL era start."
        required: false
        default: "2018-07-01"
        type: string
      end:
        description: "Last date (YYYY-MM-DD). Blank = today in IST."
        required: false
        type: string
      per_date_files:
        description: "Write one xlsx + pdf per date (thousands of files)."
        required: false
        default: true
        type: boolean
      include_pdf:
        description: "Include the per-date PDFs."
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Report coverage without writing or committing anything."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backfill
        run: |
          ARGS="--output-dir data"
          if [ -n "${{ inputs.start }}" ]; then ARGS="$ARGS --start ${{ inputs.start }}"; fi
          if [ -n "${{ inputs.end }}" ];   then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          if [ "${{ inputs.per_date_files }}" = "false" ]; then ARGS="$ARGS --no-per-date"; fi
          if [ "${{ inputs.include_pdf }}" = "false" ];    then ARGS="$ARGS --no-pdf"; fi
          if [ "${{ inputs.dry_run }}" = "true" ];         then ARGS="$ARGS --dry-run"; fi
          echo "Running: python scripts/backfill.py $ARGS"
          python scripts/backfill.py $ARGS

      - name: Report what was produced
        if: inputs.dry_run != true
        run: |
          echo "Excel files: $(find data/excel -name '*.xlsx' 2>/dev/null | wc -l)"
          echo "PDF files:   $(find data/pdf   -name '*.pdf'  2>/dev/null | wc -l)"
          echo "Total size:  $(du -sh data 2>/dev/null | cut -f1)"

      - name: Commit backfilled data
        if: inputs.dry_run != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin ${{ github.ref_name }}
          git reset --mixed origin/${{ github.ref_name }}

          git add data/
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          # Thousands of files in one commit is fine for git, but the push can
          # be large — allow a bigger buffer than the default.
          git config http.postBuffer 524288000
          git commit -m "Historical backfill: ${{ inputs.start }} to ${{ inputs.end || 'today' }}"
          git push origin HEAD:${{ github.ref_name }}
